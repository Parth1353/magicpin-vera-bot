# Render's free tier spins an instance down after ~15 minutes of inactivity, and a cold
# start takes 30-60s. The judge harness polls /v1/healthz every 60s and disqualifies a bot
# after three consecutive failures, so a spin-down during the scoring window is the single
# biggest operational risk on this plan.
#
# This pings the service often enough that it never idles out. GitHub schedules are
# best-effort and can drift by several minutes, hence the 10-minute interval rather than 14.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /v1/healthz
        run: |
          URL="https://magicpin-vera-bot-9ckg.onrender.com/v1/healthz"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "$URL" || true)
            echo "attempt $attempt -> HTTP $code $(cat /tmp/health.json 2>/dev/null | head -c 200)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::service did not return 200 after 6 attempts"
